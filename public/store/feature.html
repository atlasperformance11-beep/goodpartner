<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Good Partner feature graphic</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 1024px;
        height: 500px;
        background: #f3efe6;
        color: #1c1914;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        align-items: center;
        padding: 0 72px;
        box-sizing: border-box;
      }
      .mark {
        width: 140px;
        height: 140px;
        margin-right: 48px;
        flex-shrink: 0;
      }
      h1 {
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 12px;
        line-height: 1;
      }
      p {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 24px;
        color: #3d5344;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#3D5344"/>
      <g fill="#F4EFE6">
        <ellipse cx="12" cy="14.5" rx="7.4" ry="3.5" transform="rotate(-40 12 14.5)"/>
        <ellipse cx="20" cy="14.5" rx="7.4" ry="3.5" transform="rotate(40 20 14.5)"/>
        <rect x="15.2" y="14" width="1.6" height="10.5" rx="0.8"/>
      </g>
    </svg>
    <div>
      <h1>Good Partner</h1>
      <p>Never forget the little things.</p>
    </div>
  </body>
</html>
