<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Good Partner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3efe6;
        --fg: #1c1914;
        --muted: #6b6358;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1914;
          --fg: #f3efe6;
          --muted: #b8ae9e;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.45;
      }
      a {
        color: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Good Partner</h1>
      <p>
        Capacitor webDir fallback. The iOS shell loads the live app at
        <a href="https://goodpartner.grok.me">goodpartner.grok.me</a>
        via <code>server.url</code> in <code>capacitor.config.ts</code>.
      </p>
    </main>
  </body>
</html>
